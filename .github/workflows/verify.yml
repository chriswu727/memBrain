name: Verify

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'evaluations/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'evaluations/**'
  workflow_call:  # The release workflow runs the same checks before publishing.
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-disposable-admin
          POSTGRES_DB: agent_memory
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_memory"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MEMBRAIN_SEMANTIC: '0'
      MEMORY_DATABASE_APP_PASSWORD: ci-disposable-app
      # tests/test_memory_page_browser.py fails instead of skipping when Playwright or Chromium is missing.
      MEMBRAIN_REQUIRE_BROWSER: '1'
      MEMORY_DESKTOP_E2E: '1'
      MEMORY_CHAT_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
      MEMBRAIN_TEST_EMBEDDING_MODEL: ${{ github.workspace }}/../membrain-test-model
    steps:
      - name: Configure service database URLs
        env:
          MEMBRAIN_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          [[ "$MEMBRAIN_TEST_POSTGRES_PORT" =~ ^[0-9]+$ ]]
          printf 'MEMORY_DATABASE_URL=postgresql://memory_app:ci-disposable-app@127.0.0.1:%s/agent_memory\n' "$MEMBRAIN_TEST_POSTGRES_PORT" >> "$GITHUB_ENV"
          printf 'MEMORY_MIGRATION_DATABASE_URL=postgresql://postgres:ci-disposable-admin@127.0.0.1:%s/agent_memory\n' "$MEMBRAIN_TEST_POSTGRES_PORT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The pinned runtime commit must be present to compare it with the source.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: ${{ env.MEMBRAIN_TEST_EMBEDDING_MODEL }}/models
          key: local-embedding-${{ runner.os }}-${{ hashFiles('src/membrain/local_embeddings.py') }}
      - name: Prepare the pinned local embedding model
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from membrain.local_embeddings import download, installed, runtime_available

          assert runtime_available(), "The local embedding runtime must be installed for full verification."
          directory = Path(os.environ["MEMBRAIN_TEST_EMBEDDING_MODEL"])
          download(directory)
          assert installed(directory) is not None
          PY
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run membrain migrate
      - run: uv run ruff check src tests examples
      - name: Diagnose zero-model scenario service startup
        id: scenario_startup
        timeout-minutes: 5
        run: uv run pytest -q tests/test_c5_harness.py::test_page_actions_go_through_the_api_and_remove_only_what_they_name -x -o faulthandler_timeout=90
      - name: Diagnose Linux native loader after startup failure
        if: failure() && steps.scenario_startup.outcome == 'failure'
        run: uv run python scripts/diagnose_native_loader.py
      - run: uv run pytest -v --durations=15
      - run: npm ci && npm test && npm run typecheck
        working-directory: sdk/typescript
      - run: uv build
